name: Forward PR to StegVerse AI Bridge [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block legacy public-repository bridge dispatch
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy workflow is contained because it used a generic non-TV/TVC credential to dispatch to the superseded StegVerse/hybrid-collab-bridge repository path."
          echo "This repository is currently public; historical credential/run/visibility provenance remains an explicit audit requirement."
          exit 1
